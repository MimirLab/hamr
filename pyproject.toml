[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hamr"
version = "0.4.9.dev73"
description = "hamr: local audiobooks with recoverable jobs, character voices and source provenance"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "beautifulsoup4==4.14.2",
    "lxml==6.0.2",
    "markdown-it-py==4.0.0",
    "mdit-py-plugins==0.5.0",
    "pypdfium2==5.1.0",
    "Pillow==12.0.0",
    "httpx==0.28.1",
    "numpy==2.3.4",
    "mutagen==1.48.1",
    "tinycss2==1.4.0",
    "PyYAML==6.0.4",
    "docutils==0.23",
    "quickjs-ng==0.18.0.2",
    "pylatexenc==2.10",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "reportlab==4.4.4"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[project.scripts]
hamr = "audiobook.cli:main"
audiobook = "audiobook.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook", "src/hamr"]
artifacts = [
    "/src/audiobook/cast_assets/*/voice.json",
    "/src/audiobook/cast_assets/*/reference.wav",
    "/src/audiobook/ocr_resident/*",
    "/src/audiobook/intake_resident/*",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/audiobook", "src/hamr", "tools/check_release.py", "tools/inspect_gguf.py", "tools/compare_breeze.py", "tools/mix_hoppou.py",
    "tools/build_timing_name_spellings.py",
    "tools/build_intake_ocr.sh", "tools/build_intake_ocr_windows.sh", "tools/build_intake_mobi.sh",
    "tools/intake_djvu.cc", "tools/intake_chm.c", "tools/build_intake_chm.sh",
    "tools/intake_legacy_office.cc", "tools/build_intake_legacy_office.sh", "tools/intake_legacy_office_libmwaw.patch",
    "tools/build_intake_xps.py", "tools/build_xps_libarchive.sh", "tools/intake_xps_runtime.json",
    "tools/performance_review.py", "tools/master_cast_gallery.py",
    "tests", "fixtures/technical.md", "fixtures/chm_ordered.chm", ".gitignore",
    "README.md", "RELEASE.md", "AGENTS.md", "LICENSE", "pyproject.toml", "uv.lock", "install.sh", "install.ps1",
    "docs/USAGE.md", "docs/INTAKE.md", "docs/CAST.md", "docs/ARTWORK.md", "docs/ENGINES.md", "docs/listen", "docs/man",
    "docs/art/hamr-storyforge.png", "docs/art/hamr-listener.png",
    "docs/demo/lantern.md", "docs/demo/lantern-plain.mp3", "docs/demo/lantern-expressive.mp3",
]
artifacts = [
    "/src/audiobook/cast_assets/*/voice.json",
    "/src/audiobook/cast_assets/*/reference.wav",
    "/src/audiobook/ocr_resident/*",
    "/src/audiobook/intake_resident/*",
]

[tool.hatch.build.targets.wheel.force-include]
"docs/listen" = "audiobook/cast_previews"

[tool.hatch.build.targets.wheel.shared-data]
"docs/man" = "share/man/man1"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
