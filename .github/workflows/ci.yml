name: Linux checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux command dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mpv groff man-db zsh fish tesseract-ocr tesseract-ocr-eng
      - name: Test and check archives
        run: |
          uv sync --frozen --python 3.12 --extra test
          uv run --no-sync pytest -q --tb=short
          uv build
          uv run --no-sync python tools/check_release.py
      - name: Test installed command, manual and completion outside the checkout
        shell: bash
        run: |
          run_dir=$(mktemp -d)
          ./install.sh "$run_dir/app" "$run_dir/bin"
          export PATH="$run_dir/bin:$PATH"
          export MANPATH="$run_dir/share/man:"
          cd "$run_dir"
          hamr --version
          hamr setup --help
          man -w 1 hamr
          man -w 1 audiobook
          groff -ww -Tutf8 -man "$run_dir/share/man/man1/hamr.1" > hamr.txt
          hamr completion bash | bash -n
          hamr completion zsh | zsh -n
          hamr completion fish | fish --no-execute
          hamr agent capabilities > capabilities.json
          hamr --home "$run_dir/state" voice sample nigel-thornberry --json

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate Windows runtime contracts
        run: |
          uv sync --frozen --python 3.12 --extra test
          uv run --no-sync python -m pytest -q tests/test_runtime_portability.py tests/test_profile_dispatch.py
          uv build --wheel
          ./install.ps1
          $hamr = Join-Path $env:LOCALAPPDATA 'hamr-app\venv\Scripts\hamr.exe'
          Set-Location $env:RUNNER_TEMP
          & $hamr --version
          & $hamr --home 'preview state' voice sample nigel-thornberry --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render and recover Windows CPU controls
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-speech]')
        timeout-minutes: 12
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $hamr = Join-Path $env:LOCALAPPDATA 'hamr-app\venv\Scripts\hamr.exe'
          $work = Join-Path $env:RUNNER_TEMP 'hamr-native-control'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work
          Set-Content 'Garden control.md' 'A quiet bird waited in the garden.'
          New-Item -ItemType Directory -Force -Path 'published' | Out-Null
          $setup = (& $hamr --home 'speech state' setup --profile cpu-q8 --json | Out-String) | ConvertFrom-Json
          if ($setup.health.actual_device -notlike 'CPU*') { throw 'The CPU runtime was not verified.' }
          $PSNativeCommandUseErrorActionPreference = $false
          $publication = & $hamr --home 'speech state' open 'Garden control.md' --output 'published' --voice cast:nigel-thornberry --yes --json | Out-String
          $publicationExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          $result = $publication | ConvertFrom-Json
          if ($publicationExit -ne 0 -or $result.status -ne 'ready') { throw "The control book did not publish. $publication" }
          $m4b = Join-Path $result.output 'book.m4b'
          ffprobe -v error -show_entries format=duration -of json $m4b
          $inspection = (& $hamr --home 'speech state' agent inspect $result.job --verify | Out-String) | ConvertFrom-Json
          if (-not $inspection.publication_verified) { throw 'Publication checksums did not verify.' }

          Set-Content 'Recovery control.md' 'A small bird sang in the garden.'
          $queued = (& $hamr --home 'speech state' queue 'Recovery control.md' --output 'published' --voice cast:nigel-thornberry --json | Out-String) | ConvertFrom-Json
          $previousCount = @(Get-ChildItem 'speech state\clips' -Filter audio.pcm -File -Recurse).Count
          $PSNativeCommandUseErrorActionPreference = $false
          $env:AUDIOBOOK_FAULT = 'after_clip_rename'
          try {
            & $hamr --home 'speech state' resume $queued.job --json
            $interruptedExit = $LASTEXITCODE
          } finally {
            Remove-Item Env:AUDIOBOOK_FAULT
            $PSNativeCommandUseErrorActionPreference = $true
          }
          if ($interruptedExit -ne 86) { throw "Expected an interrupted render, got $interruptedExit." }
          $committed = @(Get-ChildItem 'speech state\clips' -Filter audio.pcm -File -Recurse | ForEach-Object { Get-FileHash -LiteralPath $_.FullName })
          if ($committed.Count -ne ($previousCount + 1)) { throw 'The interrupted render did not commit a take.' }

          $PSNativeCommandUseErrorActionPreference = $false
          $recovery = & $hamr --home 'speech state' resume $queued.job --json | Out-String
          $recoveryExit = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          $recovered = $recovery | ConvertFrom-Json
          if ($recoveryExit -ne 0 -or $recovered.status -ne 'ready') { throw "The interrupted control did not publish. $recovery" }
          foreach ($take in $committed) {
            if ((Get-FileHash -LiteralPath $take.Path).Hash -ne $take.Hash) { throw 'Resume changed committed audio.' }
          }
          ffmpeg -v error -nostdin -i (Join-Path $recovered.output 'book.m4b') -map '0:a:0' -f null -
          & $hamr --home 'speech state' cleanup --apply --json
          foreach ($publishedJob in @($result.job, $recovered.job)) {
            $inspection = (& $hamr --home 'speech state' agent inspect $publishedJob --verify | Out-String) | ConvertFrom-Json
            if (-not $inspection.publication_verified) { throw 'Cleanup did not preserve a ready book.' }
          }
          Write-Output 'Recovery kept committed audio hashes. Both books decoded or probed and verified after cleanup.'
