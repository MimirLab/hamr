name: Linux checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux command dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mpv groff man-db zsh fish tesseract-ocr tesseract-ocr-eng
      - name: Test and check archives
        run: |
          uv sync --frozen --python 3.12 --extra test
          uv run --no-sync pytest -q --tb=short
          uv build
          uv run --no-sync python tools/check_release.py
      - name: Test installed command, manual and completion outside the checkout
        shell: bash
        run: |
          run_dir=$(mktemp -d)
          ./install.sh "$run_dir/app" "$run_dir/bin"
          export PATH="$run_dir/bin:$PATH"
          export MANPATH="$run_dir/share/man:"
          cd "$run_dir"
          hamr --version
          hamr setup --help
          man -w 1 hamr
          man -w 1 audiobook
          groff -ww -Tutf8 -man "$run_dir/share/man/man1/hamr.1" > hamr.txt
          hamr completion bash | bash -n
          hamr completion zsh | zsh -n
          hamr completion fish | fish --no-execute
          hamr agent capabilities > capabilities.json
          hamr --home "$run_dir/state" voice sample nigel-thornberry --json

  windows-preview:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Validate Windows runtime contracts
        run: |
          uv sync --frozen --python 3.12 --extra test
          uv run --no-sync python -m pytest -q tests/test_runtime_portability.py tests/test_profile_dispatch.py
          uv build --wheel
          ./install.ps1
          $hamr = Join-Path $env:LOCALAPPDATA 'hamr-app\venv\Scripts\hamr.exe'
          Set-Location $env:RUNNER_TEMP
          & $hamr --version
          & $hamr --home 'preview state' voice sample nigel-thornberry --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render one checked Windows CPU control
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[windows-speech]')
        timeout-minutes: 12
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress
          }
          $hamr = Join-Path $env:LOCALAPPDATA 'hamr-app\venv\Scripts\hamr.exe'
          $work = Join-Path $env:RUNNER_TEMP 'hamr-native-control'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          Set-Location $work
          Set-Content 'Garden control.md' 'A quiet bird waited in the garden.'
          New-Item -ItemType Directory -Force -Path 'published' | Out-Null
          $setup = (& $hamr --home 'speech state' setup --profile cpu-q8 --json | Out-String) | ConvertFrom-Json
          if ($setup.health.actual_device -notlike 'CPU*') { throw 'The CPU runtime was not verified.' }
          $result = (& $hamr --home 'speech state' open 'Garden control.md' --output 'published' --voice cast:nigel-thornberry --yes --json | Out-String) | ConvertFrom-Json
          if ($result.status -ne 'ready') { throw 'The control book did not pass its publication checks.' }
          $m4b = Join-Path $result.output 'book.m4b'
          ffprobe -v error -show_entries format=duration -of json $m4b
          $inspection = (& $hamr --home 'speech state' agent inspect $result.job --verify | Out-String) | ConvertFrom-Json
          if (-not $inspection.publication_verified) { throw 'Publication checksums did not verify.' }
